name: Wheel Strategy Auto Scanner

on:
  schedule:
    # 避開整點佇列塞車，設定於美股開盤前半場執行 (台灣時間 21:45 與 23:15)
    # 1. 台灣時間 21:45 (UTC 13:45) - 夏令開盤後 15 分鐘
    - cron: '45 13 * * 1-5'
    # 2. 台灣時間 23:15 (UTC 15:15) - 睡前盤中最後掃描
    - cron: '15 15 * * 1-5'
  # 允許手動從 GitHub 介面觸發測試
  workflow_dispatch:
    inputs:
      force_notify:
        description: '強制發送 Telegram 推播 (略過時段檢查)'
        required: false
        default: false
        type: boolean

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Auto Scanner
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
        FORCE_NOTIFY: ${{ inputs.force_notify }}
      run: |
        python auto_scanner.py
